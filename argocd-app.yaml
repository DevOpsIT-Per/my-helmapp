# argocd-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/your-user/my-app-helm.git
    targetRevision: HEAD
    path: my-app                  # path inside the repo
    helm:
      valueFiles:
        - values.yaml
      # override specific values inline:
      parameters:
        - name: replicaCount
          value: "3"

  destination:
    server: https://kubernetes.default.svc
    namespace: my-app-ns

  syncPolicy:
    automated:
      prune: true        # delete resources removed from git
      selfHeal: true     # revert manual kubectl changes
    syncOptions:
      - CreateNamespace=true
